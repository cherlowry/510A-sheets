# Schema for 510A concept + instruction sheets
# Format: JSON Schema (draft 2020-12), written in YAML so it is easy to read.
# It describes the frontmatter block at the top of each sheet.

$schema: "https://json-schema.org/draft/2020-12/schema"
title: 510A Sheet Frontmatter
type: object
additionalProperties: false

required:
  - sheet_id
  - title
  - course
  - instructor
  - week
  - sheet_type
  - topics
  - summary
  - author
  - updated
  - status
  - ai_use

properties:

  # == Identity ==
  sheet_id:
    description: Unique ID. Course, two-digit week, short name. Example 510A-03-fact-sheet
    type: string
    pattern: "^510A-[0-9]{2}-[a-z0-9-]+$"
  title:
    description: Human-readable title. Also use it as the gist description.
    type: string
    maxLength: 80
  course:
    type: string
    const: 510A
  instructor:
    type: string
    default: CM Lowry
  week:
    description: Week the sheet belongs to. 0 means a reference sheet for any week.
    type: integer
    minimum: 0
    maximum: 10

  # == What kind of sheet ==
  sheet_type:
    description: concept explains an idea; instruction walks through steps; concept-and-instruction does both.
    type: string
    enum: [concept, instruction, concept-and-instruction]
  topics:
    description: 1 to 4 terms from the controlled list. Add new terms here first, then use them in sheets.
    type: array
    minItems: 1
    maxItems: 4
    uniqueItems: true
    items:
      type: string
      enum:
        - ai-basics
        - content-infrastructure
        - content-standards
        - authorship
        - provenance
        - retrieval
        - grounding
        - vocabulary
        - classification
        - evaluation
        - human-judgment
        - governance
        - media-theory
        - markdown-yaml
        - github
  summary:
    description: One or two sentences. What the sheet covers and what students make.
    type: string
    maxLength: 300

  # == Doing the work ==
  build_file:
    description: The repository file students create or edit, if any.
    type: [string, "null"]
  time_estimate:
    description: Minutes to complete.
    type: integer
    minimum: 1
  prerequisites:
    description: sheet_ids to read first.
    type: array
    items:
      type: string
      pattern: "^510A-[0-9]{2}-[a-z0-9-]+$"
  related:
    description: sheet_ids or gist URLs to read next.
    type: array
    items:
      type: string

  # == Provenance ==
  author:
    type: string
  created:
    type: string
    format: date
  updated:
    type: string
    format: date
  version:
    description: Bump the first number for big rewrites, the second for small fixes.
    type: [string, number]
  status:
    type: string
    enum: [draft, published, retired]
  ai_use:
    description: Same scale students use on their fact sheets.
    type: string
    enum: [none, research only, edited]
  sources:
    type: array
    items:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string }
        author: { type: string }
        year: { type: integer }
        url: { type: string }
  license:
    type: string
